name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LayoutProps 같은 전역 라우트 타입은 next dev/build/typegen이 생성한다 — CI엔 .next가 없으므로 먼저 생성.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm run test:unit
