name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LayoutProps 같은 전역 라우트 타입은 next dev/build/typegen이 생성한다 — CI엔 .next가 없으므로 먼저 생성.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm run test:unit

  collector-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collector:build -- --origin https://neodio.vercel.app --platform win-x64
      - run: npm run test:collector
      - run: choco install innosetup --no-progress -y
      - run: npm run collector:build-wizard
      - uses: actions/upload-artifact@v4
        with:
          name: collector-windows-wizard
          path: dist/collector/*-setup.exe
          if-no-files-found: error
      - name: Verify Windows wizard install and removal
        shell: pwsh
        run: |
          $version = (Select-String -Path src/lib/collectorAgent.ts -Pattern 'COLLECTOR_VERSION = "([\d.]+)"').Matches.Groups[1].Value
          $installer = Resolve-Path "dist/collector/neodio-collector-win-x64-$version-setup.exe"
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $runtime = Join-Path $env:LOCALAPPDATA 'NeodioCollector/runtime'
          $startup = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Startup/neodio-collector.vbs'
          if (!(Test-Path (Join-Path $runtime 'neodio-collector.exe')) -or !(Test-Path $startup)) { throw 'Collector installation is incomplete' }
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs/Neodio Collector/unins000.exe'
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed: $($remove.ExitCode)" }
          if ((Test-Path $runtime) -or (Test-Path $startup)) { throw 'Collector files or startup entry remain after removal' }
